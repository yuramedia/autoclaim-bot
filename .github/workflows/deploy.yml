name: Deploy

on:
    push:
        branches: [main]

# Prevent concurrent deploys — if a new push arrives while deploying, cancel the old run.
concurrency:
    group: deploy-production
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: yuramedia/autoclaim-bot

jobs:
    test:
        name: Run Tests & Checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: latest

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Check Formatting
              run: bun run format:check

            - name: Run Linter
              run: bun run lint

            - name: Type Check
              run: bunx tsc --noEmit

            - name: Run Tests
              run: bun test --preload ./src/test-setup.ts

    build:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bf8388060db527dff14f48b6a5fdbe70763c1213 # v3

            - name: Log in to Container Registry
              uses: docker/login-action@d0b8297dd55199249f38268efae35fcb03f75aab # v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@45f22b1c11cde996551e271bed2de12d5a091009 # v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        needs: build
        runs-on: ubuntu-latest

        # Registers the job as a tracked GitHub Deployment (shows in the
        # "Deployments" sidebar and lets you add protection rules later).
        environment:
            name: production

        steps:
            - name: Checkout Repository
              uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

            - name: Copy docker-compose.yml to Server
              uses: appleboy/scp-action@7e85c2e09aa21988492acd66466b5d68bda49e2b # v0
              with:
                  host: ${{ secrets.DEPLOY_SSH_HOST }}
                  username: ${{ secrets.DEPLOY_SSH_USERNAME }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  port: ${{ secrets.DEPLOY_SSH_PORT }}
                  source: "docker-compose.yml"
                  target: ${{ secrets.DEPLOY_SSH_PATH }}

            - name: Deploy to Server
              uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # v1
              env:
                  DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
                  DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
                  MONGODB_URI: ${{ secrets.MONGODB_URI }}
                  CLAIM_HOUR: ${{ vars.CLAIM_HOUR || '0' }}
                  CLAIM_MINUTE: ${{ vars.CLAIM_MINUTE || '0' }}
                  CR_ETP_RT: ${{ secrets.CR_ETP_RT }}
                  U2_RSS_URL: ${{ secrets.U2_RSS_URL }}
                  AMENZB_API_KEY: ${{ secrets.AMENZB_API_KEY }}
                  TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
              with:
                  host: ${{ secrets.DEPLOY_SSH_HOST }}
                  username: ${{ secrets.DEPLOY_SSH_USERNAME }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  port: ${{ secrets.DEPLOY_SSH_PORT }}
                  password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
                  envs: DISCORD_TOKEN,DISCORD_CLIENT_ID,MONGODB_URI,CLAIM_HOUR,CLAIM_MINUTE,CR_ETP_RT,U2_RSS_URL,AMENZB_API_KEY,TOKEN_ENCRYPTION_KEY
                  script: |
                      mkdir -p ${{ secrets.DEPLOY_SSH_PATH }}
                      cd ${{ secrets.DEPLOY_SSH_PATH }}

                      # Write .env.production from GitHub secrets
                      cat > .env.production << ENVEOF
                      DISCORD_TOKEN=${DISCORD_TOKEN}
                      DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
                      MONGODB_URI=${MONGODB_URI}
                      CLAIM_HOUR=${CLAIM_HOUR}
                      CLAIM_MINUTE=${CLAIM_MINUTE}
                      CR_ETP_RT=${CR_ETP_RT}
                      U2_RSS_URL=${U2_RSS_URL}
                      AMENZB_API_KEY=${AMENZB_API_KEY}
                      TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
                      ENVEOF
                      chmod 600 .env.production

                      # Pull latest image
                      docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

                      # Restart container
                      docker compose up -d --remove-orphans

                      # Wait until the container is healthy (up to 60 seconds)
                      echo "Waiting for container to be ready..."
                      for i in $(seq 1 12); do
                          STATUS=$(docker inspect --format='{{.State.Status}}' autoclaim-bot 2>/dev/null || echo "missing")
                          if [ "$STATUS" = "running" ]; then
                              echo "✓ Container is running (attempt $i)"
                              break
                          fi
                          echo "  Attempt $i/12: status=$STATUS — retrying in 5s"
                          sleep 5
                      done

                      # Register slash commands
                      docker compose exec -T autoclaim-bot bun run deploy
                      echo "✓ Slash commands registered"

                      # Final status
                      docker compose ps
                      echo "✓ Deployment completed"
