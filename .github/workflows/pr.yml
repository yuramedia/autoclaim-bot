name: Pull Request Check

on:
    pull_request:
        branches: [main]

jobs:
    lint:
        name: Lint & Format
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: latest

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Check Formatting
              run: bun run format:check

            - name: Run Linter
              run: bun run lint

            - name: Type Check
              run: bunx tsc --noEmit

            - name: Run Tests
              run: bun test --preload ./src/test-setup.ts

    build-test:
        name: Test Docker Build
        runs-on: ubuntu-latest
        needs: lint

        steps:
            - name: Checkout Repository
              uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bf8388060db527dff14f48b6a5fdbe70763c1213 # v3

            - name: Test Build Docker Image
              uses: docker/build-push-action@45f22b1c11cde996551e271bed2de12d5a091009 # v6
              with:
                  context: .
                  push: false
                  tags: yuramedia/autoclaim-bot:pr-test
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
