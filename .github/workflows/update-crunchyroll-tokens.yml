name: Update Crunchyroll Tokens

on:
    schedule:
        # Run daily at 00:00 UTC
        - cron: "0 0 * * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    extract-and-update:
        name: Extract & Update Crunchyroll Tokens
        runs-on: ubuntu-latest

        env:
            TOKEN_ENCRYPTION_KEY: ci-placeholder-not-used-by-extraction-script
        steps:
            - name: Checkout Repository
              uses: actions/checkout@main

            - name: Setup Java (for JADX)
              uses: actions/setup-java@main
              with:
                  java-version: "17"
                  distribution: "temurin"

            - name: Install pinned JADX
              env:
                  JADX_VERSION: "1.5.7"
                  JADX_SHA256: "1755e4242ade71a077438723689f404079592ec7764a3a0572f98fef94ebcbf3"
              run: |
                  set -euo pipefail
                  curl -fsSL -o /tmp/jadx.zip \
                    "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
                  echo "${JADX_SHA256}  /tmp/jadx.zip" | sha256sum --check
                  unzip -q /tmp/jadx.zip -d /opt/jadx
                  ln -s /opt/jadx/bin/jadx /usr/local/bin/jadx
                  jadx --version

            - name: Setup Bun
              uses: oven-sh/setup-bun@main
              with:
                  bun-version: 1.4.5

            - name: Run Independent Extraction Script
              run: bun run scripts/extract-crunchyroll-tokens.ts

            - name: Commit and Push Changes
              run: |
                  if [[ -n $(git status -s src/constants/crunchyroll.ts) ]]; then
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git add src/constants/crunchyroll.ts
                    git commit -m "chore(crunchyroll): auto-update basic auth token and UA"
                    git push origin main
                  else
                    echo "No token changes detected."
                  fi
