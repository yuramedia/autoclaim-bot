services:
    bot:
        image: ghcr.io/yuramedia/autoclaim-bot:${IMAGE_TAG:-latest}
        container_name: autoclaim-bot
        restart: unless-stopped

        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'bun|node' || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s

        env_file:
            - .env.production

        environment:
            NODE_ENV: production

        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: 2
                reservations:
                    memory: 256M

        volumes:
            - ./data:/app/data
            - ./logs:/app/logs

networks:
    default:
        name: yura-network
        external: true
